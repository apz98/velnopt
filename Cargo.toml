[workspace]
members = [
    "crates/velnopt-cli",
    "crates/velnopt-config",
    "crates/velnopt-hyprland",
    "crates/velnopt-services",
    "crates/velnopt-ui",
    "crates/velnopt-wayland",
    "crates/velnopt-widgets",
]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99.1"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
accesskit = "0.25.2"
accesskit_unix = "0.24.1"
# Already pulled in through calloop. Its safe posix_spawn sets the child's signal mask.
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal", "term"] }
clap = { version = "4.6.7", features = ["derive"] }
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
# Upstream's fontdb 0.24 migration drops the unmaintained ttf-parser.
# Stay on this exact revision until a crates.io release includes that migration.
cosmic-text = { git = "https://github.com/pop-os/cosmic-text", rev = "b07cb90a872cb9fec7fea1c72d734f81907fe3ad" }
async-channel = "2.5.0"
async-io = "2.6.0"
futures-lite = "2.6.1"
png = "0.18.1"
pulseaudio = "0.3.2"
zbus = "6.1.0"
calloop = { version = "0.14.5", features = ["signals"] }
calloop-wayland-source = "0.4.1"
rustix = { version = "1.1.6", features = ["fs", "event", "net", "process"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
velnopt-config = { path = "crates/velnopt-config" }
velnopt-hyprland = { path = "crates/velnopt-hyprland" }
velnopt-services = { path = "crates/velnopt-services" }
velnopt-ui = { path = "crates/velnopt-ui" }
velnopt-wayland = { path = "crates/velnopt-wayland" }
velnopt-widgets = { path = "crates/velnopt-widgets" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
